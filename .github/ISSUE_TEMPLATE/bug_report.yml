name: Bug report
description: Something isn't working as documented
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the series key (e.g. UK_DAILY) if relevant.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: economicpolicyuncertainty version
      description: "`pip show economicpolicyuncertainty`"
    validations:
      required: true
